# ─────────────────────────────────────────────────────────────
#  Zentrale Einstellungen der Webseite
#  Die meisten Angaben hier müssen nur einmal angepasst werden.
# ─────────────────────────────────────────────────────────────

# Adresse der fertigen Seite (nach dem Veröffentlichen anpassen,
# z. B. "https://tobiasrothmund.de/" oder "https://<nutzername>.github.io/")
baseURL = "https://tobiasrothmund.github.io/"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
timeZone = "Europe/Berlin"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true            # erlaubt bei Bedarf eingebettetes HTML in Beiträgen
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  noClasses = false

# ── Persönliche Angaben (sprachunabhängig) ───────────────────
[params]
  name = "Tobias Rothmund"
  honorific = "Prof. Dr."
  email = "tobias.rothmund@uni-jena.de"
  # Porträtfoto: Datei in static/images/ ablegen und Namen hier eintragen.
  # Leer lassen = elegante Initialen-Grafik.
  portrait = ""
  # Kürzel, das in Publikationslisten hervorgehoben wird
  highlightAuthor = "Rothmund, T."

  # Profile (leer lassen, um sie auszublenden)
  [params.links]
    scholar = "https://scholar.google.de/citations?user=WADUSNEAAAAJ"
    orcid = ""
    researchgate = ""
    linkedin = "https://de.linkedin.com/in/tobias-rothmund-62250015"
    bluesky = ""
    mastodon = ""
    osf = ""

